  ttlSec: 60
  maxUsage: 8
  message: >
    Chill out, cowboy!
    You don't want to overload our poor server.

antispam: # flags the users who spam messages on multiple channels in a short timeframe.
  enabled: true
  logChannelId: "918987870197395577" # TODO: migrate to the "auto mod messages" channel
  moderatorsBypass: true
  messageTTLSec: 60 # how long the messages should be kept in the memory.
  maxChannelsPerUser: 3 # the maximum number of channels a user can send messages in within the defined TTL timeframe.
