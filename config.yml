        min: 2
        max: 50
        required: true
        multiline: false
      - id: "links"
        placeholder: "https://github.com/foo/bar\nhttps://your.personal-website.com/"
        min: 0
        max: 200
        required: false
        multiline: true

  job-opportunities: # Job listing
