  docs behind-proxy:
    description: "How to enable the trust proxy option when NestJS app is behind a reverse proxy"
    content: >
      When your NestJS application is behind a reverse proxy, you may need to enable the `trust proxy` option in Express or Fastify, depending on your server.
      
      
      In Express, you can enable the `trust proxy` option using the `app.set()` method.
      
      ```typescript
      
      async function bootstrap() {
        const app = await NestFactory.create(AppModule);

        app.set('trust proxy', true); // <----

        await app.listen(3000);
      }
      ```
      
      If you're using Fastify, you can enable the `trustProxy` option in `FastifyAdapter`.
      
      ```typescript
      
      import { FastifyAdapter, NestFastifyApplication } from '@nestjs/platform-fastify';
      
      
      async function bootstrap() {
        const app = await NestFactory.create<NestFastifyApplication>(
          AppModule,

          new FastifyAdapter({
            trustProxy: true, // <----
          }),
        );
      }
      ```
      
      > By enabling the `trust proxy` option, Express/Fastify will trust the `X-Forwarded-For` header and consider it the client's IP address.
      
      
      Suppose you use the `@nestjs/throttler` module to rate-limit users and protect applications from brute-force attacks.
      
      In that case, besides enabling the `trust proxy` option, you should override the `getTracker()` method to pull the value from the header rather than from `req.ip`.
      
      ```ts
      
      // throttler-behind-proxy.guard.ts
      
      import { ThrottlerGuard } from '@nestjs/throttler';
      
      import { Injectable } from '@nestjs/common';
      
      
      @Injectable()
      export class ThrottlerBehindProxyGuard extends ThrottlerGuard {
        protected getTracker(req: Record<string, any>): string {
          return req.ips.length ? req.ips[0] : req.ip; // individualize IP extraction to meet your own needs
        }
      }
      
      
      // app.controller.ts
      
      import { ThrottlerBehindProxyGuard } from './throttler-behind-proxy.guard';

      @UseGuards(ThrottlerBehindProxyGuard)
      ```
    buttons:
      - - label: "Express trust proxy docs"
          url: "https://expressjs.com/en/guide/behind-proxies.html"
          emoji: "🔗"
        - label: "Fastify trustProxy docs"
          url: "https://fastify.dev/docs/latest/Reference/Server#trustproxy"
          emoji: "🔗"
      - - label: "@nestjs/throttler docs"
          url: "https://docs.nestjs.com/security/rate-limiting#proxies"
          emoji: "📖"
  docs circular-dependency:
    description: "Circular dependencies in NestJS and how to avoid them"
    content: >
      Occasionally you'll find it difficult to avoid circular dependencies in your application.
      
      You'll need to take some steps to help Nest resolve these.
      Errors that arise from circular dependencies look like this:
      
      ```text
      
      Nest cannot create the <module> instance.
      
      The module at index [<index>] of the <module> "imports" array is undefined.


      Potential causes:
      
      - A circular dependency between modules. Use forwardRef() to avoid it.
      
      - The module at index [<index>] is of type "undefined". Check your import statements and the type of the module.


      Scope [<module_import_chain>]
      
      # example chain AppModule -> FooModule
      
      ```
      
      A circular dependency occurs when two classes depend on each other.
      
      For example, class A needs class B, and class B also needs class A.
      
      Circular dependencies can arise in Nest between modules and between providers.


      While circular dependencies should be avoided where possible, you can't always do so.
      
      In such cases, Nest enables resolving circular dependencies between providers in two ways.
      
      In this chapter, we describe using **forward referencing** as one technique, and using the **ModuleRef** class to retrieve a provider instance from the DI container as another.
    buttons:
      - - label: "Read rest of the documentation"
          url: "https://docs.nestjs.com/fundamentals/circular-dependency"
          emoji: "📖"
      - - label: "How to avoid circular dependencies"
          url: "https://trilon.io/blog/avoiding-circular-dependencies-in-nestjs"
          emoji: "📝"
  docs hybrid-app:
    description: "Create hybrid apps with NestJS and microservices"
    content: >
      A hybrid application is one that both listens for HTTP requests, and makes use of connected microservices.
      
      The `INestApplication` instance can be connected with `INestMicroservice` instances
      through the `connectMicroservice()` method.

      ```typescript
      
      const app = await NestFactory.create(AppModule);
      
      const microservice = app.connectMicroservice<MicroserviceOptions>({
        transport: Transport.TCP,
      });

      await app.startAllMicroservices();
      
      await app.listen(3001);
      
      ```
    buttons:
      - - label: "Documentation"
          url: "https://docs.nestjs.com/faq/hybrid-application"
          emoji: "📖"
  docs nest-debug:
    description: "Debug NestJS dependencies with environment variable"
    content: >
      Along with just manually verifying your dependencies are correct,
      as of Nest 8.1.0 you can set the `NEST_DEBUG` environment variable to a string that resolves as truthy,
      and get extra logging information while Nest is resolving all the dependencies for the application
      [.](https://docs.nestjs.com/assets/injector_logs.png)
      

      The string in yellow is the host class of the dependency being injected,
      the string in blue is the name of the injected dependency,
      or its injection token, and the string in purple is the module in which the dependency is being searched for.
      Using this, you can usually trace back the dependency resolution for what's happening
      and why you're getting dependency injection problems.

  docs process-env-population:
    description: "What to do when process.env is not populated"
    content: >
      When you use the `ConfigModule` from the `@nestjs/config` package,
      and you need to access the `process.env.FOO` variable in another module's registration function or constructors,
      you might encounter issues where `process.env.FOO` is undefined,
      even though it has the correct value when the application is fully bootstrapped.
      
      
      This occurs because `process.env` is not populated when you are accessing it.
      In such a situation, there are generally two solutions:

      ## **Solution 1.** ✅
      
      If the module provides an asynchronous way to set its options using the `forRootAsync()` or `registerAsync()` method, it's better to use this along with the `ConfigService` instead of directly reading `process.env`.
      
      ```ts
      
      import { JwtModule } from '@nestjs/jwt';

      @Module({
        imports: [
          JwtModule.registerAsync({
            imports: [ConfigModule],
            useFactory: async (configService: ConfigService) => ({
              secretOrPrivateKey: configService.get<string>('jwt.secret'),
            }),
            inject: [ConfigService],
          }),
        ]
      })
      
      export class FooModule {}
      
      ```
      
      ## **Solution 2.** ✅
      
      In the `main.ts`, the **very first** lines must be
      
      ```ts
      
      import 'dotenv/config';
      
      // or, the line below:
      
      // import { config } from 'dotenv'; config();
      
      ```
      
      It should also be __before__ **all other imports**. This will populate `process.env` for you.

      ### Side note: ⚠️
      
      When using the `@nestjs/jwt` package,
      avoid registering the `JwtService` in a `providers` array.
      It's not necessary because of the import of the `JwtModule`.
      
      Only import the `JwtModule` in the `imports` array
      and remove the `JwtService` from the `providers` array when defining the modules.
      
      ```diff
      
      import {
      
      +  JwtModule,
      
      -  JwtService
      
      } from '@nestjs/jwt';


      @Module({
        imports: [
      +   JwtModule.registerAsync({
      
      +     // ...
      
      +   }),
        ],
        providers: [
      -   JwtService,
        ],
      })
      
      export class FooModule {}
      
      ```
    buttons:
      - - label: "How to use the ConfigService"
          url: "https://docs.nestjs.com/techniques/configuration#using-the-configservice"
          emoji: "📖"
  docs providers-vs-imports:
    description: "Ensure accurate service/module listings"
    content: >
      Don't list a service in `providers` array of a module unless the module really *provides* the service.
      
      If your `ServiceA` depends on a `ServiceB` from different module `ModuleB`, add `ServiceB` to `ModuleB`'s `exports` array, 
      then add `ModuleB` to `imports` array in your module.
      
      ```ts
      
      @Module({
        providers: [ServiceB],
        exports: [
          ServiceB // <-- export the "ServiceB" provider by adding it to the module's exports array
        ], 
      })
      
      export class ModuleB {}
      
      ```
      
      ```ts
      
      @Module({
        imports: [
          ModuleB // <-- modules that wish to inject the "ServiceB" will need to import the "ModuleB" in their imports array
        ],  
        providers: [ServiceA],
      })
      
      export class ModuleA {}
      ```
      
      ```ts
      
      import { ServiceB } from '../module-b/service-b.service'
      
      
      @Injectable()
      export class ServiceA {
        constructor(private readonly serviceB: ServiceB) {}

        // async foo() {
        //   this.serviceB.bar();
        // }
      }
      ```
    buttons:
      - - label: "Read more"
          url: "https://docs.nestjs.com/faq/common-errors#cannot-resolve-dependency-error"
          emoji: "📖"
  docs request-lifecycle:
    description: "Get a grip on NestJS' request lifecycle for smooth coding"
    content: >
      Nest applications handle requests and produce responses in a sequence we refer to as the **request lifecycle**.
      
      With the use of middleware, pipes, guards, and interceptors, it can be challenging to track down where a particular piece of code executes during the request lifecycle, especially as global, controller level, and route level components come into play.
      
      ### In general, the request lifecycle looks like the following:

      1. Incoming request
      
      2. [Middleware](<https://docs.nestjs.com/middleware>)
         - Globally bound middleware
         - Module bound middleware
      3. [Guards](<https://docs.nestjs.com/guards>)
         - Global guards
         - Controller guards
         - Route guards
      4. [Interceptors](<https://docs.nestjs.com/interceptors>) _(pre-controller)_
         - Global interceptors
         - Controller interceptors
         - Route interceptors
      5. [Pipes](<https://docs.nestjs.com/pipes>)
         - Global pipes
         - Controller pipes
         - Route pipes
         - Route parameter pipes
      6. [Controller](<https://docs.nestjs.com/controllers>) _(method handler)_
      
      7. [Service](<https://docs.nestjs.com/providers>) _(if exists)_
      
      8. [Interceptors](<https://docs.nestjs.com/interceptors>) _(post-request)_
         - Route interceptor
         - Controller interceptor
         - Global interceptor
      9. [Exception filters](<https://docs.nestjs.com/exception-filters>)
         - Route
         - Controller
         - Global
      10. Server response
    buttons:
      - - label: "Documentation reference"
          url: "https://docs.nestjs.com/faq/request-lifecycle"
          emoji: "🔗"
  docs resolve-dependencies:
    description: "Nest not being able to resolve dependencies of something"
    content: >
      The most common error in Nest is failing to resolve provider dependencies.
      
      The error message usually looks something like this:
      
      ```text
      
      Nest can't resolve dependencies of the <provider> (?). Please make sure that the argument <unknown_token> at index [<index>] is available in the <module> context.


      Potential solutions:
      
      - Is <module> a valid NestJS module?
      
      - If <unknown_token> is a provider, is it part of the current <module>?
      
      - If <unknown_token> is exported from a separate @Module, is that module imported within <module>?
        @Module({
          imports: [ /* the Module containing <unknown_token> */ ]
        })
      ```
      
      The most common culprit of the error, is not having the `<provider>` in the module's `providers` array.
      
      Please make sure that the provider is indeed in the `providers` array and following standard NestJS provider practices.


      There are a few gotchas, that are common. One is putting a provider in an `imports` array.
      
      If this is the case, the error will have the provider's name where `<module>` should be.
    buttons:
      - - label: "Read more about this error"
          url: "https://docs.nestjs.com/faq/common-errors#cannot-resolve-dependency-error"
          emoji: "📖"
      - - label: "Standard NestJS provider practices"
          url: "https://docs.nestjs.com/fundamentals/custom-providers#di-fundamentals"
          emoji: "🔗"
      - - label: "Circular dependency"
          url: "https://docs.nestjs.com/faq/common-errors#circular-dependency-error"
          emoji: "🔗"
        - label: "Custom providers"
          url: "https://docs.nestjs.com/fundamentals/custom-providers"
          emoji: "🔗"
  rules codeblocks:
    description: "Letting people know how to share their code in a Markdown code block"
    content: >
      Please format your question or answer with Markdown formatting[.](https://i.sstatic.net/ETTnT.jpg)

      It leads to better readability and an easier time to spot problems.

      For code blocks, you can wrap your block with three back ticks before and after the block, and after the first three back ticks you can add a language (like `ts`) to add syntax highlighting.


      \`\`\`ts

      @Injectable()

      export class MySuperAwesomeService {

        constructor(@Inject('InjectionToken') private readonly dep: SomeDependency) {}

        getRandomNumber(): number {
          return Math.round(Math.random() * 1000);
        }
      }

      \`\`\`


      That ☝️, becomes this 👇


      ```ts

      @Injectable()

      export class MySuperAwesomeService {

        constructor(@Inject('InjectionToken') private readonly dep: SomeDependency) {}

        getRandomNumber(): number {
          return Math.round(Math.random() * 1000);
        }
      }

      ```

