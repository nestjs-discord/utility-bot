  rules no-screenshot:
    description: "When someone posts a screenshot instead of sharing their code"
    content: >
      Please **do not screenshot code** as it causes a number of issues: ⚠️

      - Ease of assistance: if someone wants to copy your code and correct it, they cannot. Making it easy for people to help you is in your best interests.
      
      - Editorializing: it's common to try to make images small, which means you're likely to crop out code relevant to your issue
      
      - Accessibility: wide images can be hard to read on mobile devices, and are impossible for screen readers.
      
      - Legibility: you cannot read screenshots of code directly, instead you have to open them in an enlarged context.
      
      - Bandwidth usage/clutter: some of our members use metered connections, and it is wasteful for them to download images of a text.

      For a small amount of code, please use Markdown code blocks.
    buttons:
      - - label: "Learn more about code blocks"
          url: "https://discord.com/channels/520622812742811698/527853342152458287/935939213512298576"
          emoji: "🔗"
  js floating-promise:
    description: "Introduction to floating Promises in JavaScript"
    content: >
      A _floating Promise_ is a type of `Promise` that is created
      without any code set up to handle any errors it might throw.
      Floating promises can cause several issues,
      such as improperly sequenced operations and ignored Promise rejections.


      In the example below, a `Promise` is created and executed.
      However, since there is no `await` keyword to wait for its resolution,
      the program continues to run without waiting for the Promise to complete.
      
      ```ts

      async function someAsyncFunction() {
        throw new Error('Whoops! 😥');
      }


      try {
        someAsyncFunction(); // no await
      } catch (e) {
        // It won't catch the error
      }


      // Uncaught (in promise) Error: Whoops! 😥
      // at someAsyncFunction (<anonymous>:2:9)
      // at <anonymous>:6:3
      
      ```

      The `Promise` returned by `someAsyncFunction()` starts executing,
      but the code execution continues immediately without waiting for the `Promise` to resolve.
      
      
      As a result, any error or thrown exception inside `someAsyncFunction()` will not be caught
      by the `try/catch` block because the Promise is not being awaited.
      This can lead to unexpected behavior or unhandled rejections,
      as the code does not handle the asynchronous operation correctly.


      To ensure that the Promise is awaited and its result is properly handled,
      you should use the `await` keyword when invoking an asynchronous function:

      ```ts

      try {
        await someAsyncFunction(); // properly awaited
      } catch (e) {
        // It will catch the error
        console.log(e.message); // Whoops! 😥
      }
      
      ```

    buttons:
      - - label: "Learn more about Promises, async/await"
          url: "https://javascript.info/async"
          emoji: "📖"
      - - label: "Eslint rule to prevent async code errors"
          url: "https://typescript-eslint.io/rules/no-floating-promises/"
          emoji: "🔗"
