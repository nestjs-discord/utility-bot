# Text input documentation:
# https://discord.com/developers/docs/interactions/message-components#text-inputs
#
# If the destination of the form submission (form.foo.channelId) is an announcement channel,
# ensure the bot *explicitly* has the following permissions:
#   - Send Messages
#   - Manage Messages
#   - Read Message History
# Otherwise, the bot will panic and the container will enter a restart loop.
# More details on announcement channels:
# https://support.discord.com/hc/en-us/articles/360032008192-Announcement-Channels
forms:
  job-profiles: # Self-promotion
    buttonLabel: "Post a new profile"
    modalTitle: "Post a new profile"
    channelId: 1294483543623335986 # prod: 1294483543623335986 | dev: 1294446757370925147
    modChannelId: 1294488503744204860 # prod: 1294488503744204860 | dev: 1292911145883275356
    modSkipApproval: false
    color: 2600544 # dark green (#27ae60)
    footer: "Details of this profile have not been verified, please do your own due diligence."
    inputs:
      - id: "about"
        placeholder: "Shortly describe yourself!"
        multiline: false
        min: 15
        max: 100
        required: true
      - id: "skills"
        placeholder: "NestJS, Node.js, TypeScript, Golang, ..."
        multiline: true
        min: 2
        max: 400
        required: true
      - id: "experiences"
        placeholder: "Use bullet points (-) for better formatting."
        multiline: true
        min: 2
        max: 600
      - id: "location"
        placeholder: "Germany, Berlin - Remote, On-site in Mitte, willing to relocate within Europe"
        min: 2
        max: 150
        required: true
        multiline: false
      - id: "links"
        placeholder: "https://github.com/foo/bar\nhttps://your.personal-website.com/"
        min: 0
        max: 200
        required: false
        multiline: true

  job-opportunities: # Job listing
    buttonLabel: "Post a new opportunity"
    modalTitle: "Post a new opportunity"
    channelId: 1294483759189725265 # prod: 1294483759189725265 | dev: 1294446864036528231
    modChannelId: 1294488539500777472 # prod: 1294488539500777472 | dev: 1292911220197953558
    modSkipApproval: false
    color: 14689102 # same as the official nestjs logo (#e0234e)
    footer: "Details of this opportunity have not been verified, please do your own due diligence."
    inputs:
      - id: "title"
        placeholder: "Senior Software Engineer"
        min: 10
        max: 100
        required: true
        multiline: false
      - id: "compensation"
        placeholder: "$50 per hour"
        min: 5
        max: 100
        required: true
        multiline: false
      - id: "location"
        placeholder: "Germany, Berlin - Remote, On-site in Mitte, willing to relocate within Europe"
        min: 5
        max: 150
        required: true
        multiline: false
      - id: "description"
        placeholder: "We are seeking an engineer to assist with back-end development and server management."
        min: 50
        max: 1000
        required: true
        multiline: true
      - id: "links"
        placeholder: "https://company.com/jobs\nhttps://github.com/organization"
        min: 10
        max: 200
        required: true
        multiline: true


archiveCommand:
  response: > # TODO: make sure to use this key
    This post has been marked as archived.
    Please use it as a reference, but do not re-open it.
    If you have a similar issue and cannot resolve it after reading this thread, please open a new post.

solvedCommand:
  description: "Close and mark a forum post as solved."
  response: > # TODO: can the unnecessary next line characters be removed from here somehow?
    This post has been marked as resolved. ✅
    Please read through the conversation and resolution, if you are having the same issue.
    If you were the original author of the post and the issue is still fresh (within a few days)
    and you are still have having trouble, continue to reply here. If you are not the original
    author of the post or the post has aged, start a new thread linking this one as relevant to
    your problem, providing as much additional information as possible.
  # Map of the forum channel IDs against their "✅ solved" tag ID
  # This should speed up the command's response time by avoid Discord API calls.
  solvedTags: # TODO: fill the values
    123: "123"

  # For each command, use a key to define the command name.
  # If a key contains a single space character, it becomes a sub-command.
  #
  #   example sub-command:
  #     description: "This is my command"
  #     content: "And this is my awesome respond! 😎"
  #     protected: false
  #     buttons:
  #       -
  #         - label: "Button 1"
  #           url: "https://button1.com/"
  #           emoji: "🔗"
  #         - label: "Button 2"
  #           url: "https://button2.com/"
  #           emoji: "🔗"
  #
  # The properties for each command are as follows:
  #
  #   description (required, max 100 characters):
  #     A short description of the command.
  #
  #   content (required, max 3000 characters):
  #     What will be the response of this command when executed.
  #
  #   protected (optional, default is false):
  #     If set to true, only moderators will be able to see and use this command.
  #
  #   buttons (optional, max eight rows and four columns):
  #     An array of arrays representing rows and columns of Discord message components, specifically link buttons.
  #     Each link button has label, url, and an optional emoji string field.
  #     See https://discord.com/developers/docs/interactions/message-components for more information on message components.
