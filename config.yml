  rules reproduction:
    description: "Request for a minimum reproduction of the issue"
    content: >
      From conversation only, it seems that we won't be able to determine the root cause of the issue.
      
      Please provide a minimum reproduction repository that reduces the issue to only the most basic components
      while still producing the same error that you're facing.
      
      By doing this, we will be better able to help you resolve your issue.
    buttons:
      - - label: "Learn more about minimum reproductions"
          url: "https://minimum-reproduction.wtf"
